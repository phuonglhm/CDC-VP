<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-green-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-purple-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #111827; }
      .title { font-size: 24px; font-weight: 700; }
      .block-title { font-size: 16px; font-weight: 700; }
      .normal { font-size: 14px; }
      .small { font-size: 12px; }
      .edge-label { font-size: 12px; paint-order: stroke; stroke: white; stroke-width: 4px; stroke-linejoin: round; }
      .control { stroke: #2563eb; fill: none; stroke-width: 2.5; }
      .local { stroke: #16a34a; fill: none; stroke-width: 2.5; }
      .external { stroke: #7c3aed; fill: none; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <rect x="40" y="60" width="1120" height="760" rx="12" fill="#ffffff" stroke="#374151" stroke-width="2.5"/>
  <text x="600" y="100" text-anchor="middle" class="title">NEO-CORE Architecture — D15 Interconnect Split</text>

  <rect x="360" y="120" width="480" height="110" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
  <text x="600" y="149" text-anchor="middle" class="block-title">RISC-V VP++ RV32GCV Hart</text>
  <rect x="385" y="165" width="190" height="45" rx="7" fill="#ffffff" stroke="#6b7280"/>
  <text x="480" y="185" text-anchor="middle" class="normal">Scalar execution</text>
  <text x="480" y="201" text-anchor="middle" class="small">RV32</text>
  <rect x="625" y="165" width="190" height="45" rx="7" fill="#ffffff" stroke="#6b7280"/>
  <text x="720" y="185" text-anchor="middle" class="normal">RVV 1.0</text>
  <text x="720" y="201" text-anchor="middle" class="small">VLEN = 512</text>

  <rect x="120" y="290" width="880" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="560" y="321" text-anchor="middle" class="block-title" fill="#1e3a8a">AXI4-Lite Control Fabric — 32-bit register access only</text>

  <rect x="100" y="400" width="170" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="185" y="438" text-anchor="middle" class="block-title">Core Control</text>
  <text x="185" y="459" text-anchor="middle" class="normal">&amp; Counters</text>

  <rect x="310" y="390" width="180" height="110" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.8"/>
  <text x="400" y="419" text-anchor="middle" class="block-title">NEO DMA</text>
  <text x="400" y="441" text-anchor="middle" class="small">AXI4-Lite control</text>
  <text x="400" y="458" text-anchor="middle" class="small">Native local port</text>
  <text x="400" y="475" text-anchor="middle" class="small">External port</text>

  <rect x="530" y="390" width="190" height="110" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.8"/>
  <text x="625" y="419" text-anchor="middle" class="block-title">SAURIA Matrix Engine</text>
  <text x="625" y="449" text-anchor="middle" class="small">64×64 bring-up</text>
  <text x="625" y="469" text-anchor="middle" class="small">128×128 target</text>

  <rect x="760" y="390" width="200" height="110" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.8"/>
  <text x="860" y="427" text-anchor="middle" class="block-title">ImageTransform</text>
  <text x="860" y="455" text-anchor="middle" class="normal">Im2Col + Col2Im</text>

  <rect x="120" y="590" width="880" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="560" y="623" text-anchor="middle" class="block-title" fill="#14532d">NEO Local SRAM Fabric — native ready/valid, banked arbitration (DATA)</text>

  <rect x="390" y="690" width="400" height="100" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <text x="590" y="722" text-anchor="middle" class="block-title">Banked Core SRAM</text>
  <text x="590" y="748" text-anchor="middle" class="normal">16 MiB logical address space</text>
  <text x="590" y="769" text-anchor="middle" class="small">bank count / width / pipeline configurable</text>

  <rect x="1030" y="370" width="110" height="190" rx="9" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="1085" y="405" text-anchor="middle" class="block-title">Bidirectional</text>
  <text x="1085" y="426" text-anchor="middle" class="block-title">AXI4 / NoC</text>
  <text x="1085" y="447" text-anchor="middle" class="block-title">Bridge</text>
  <text x="1085" y="480" text-anchor="middle" class="small">Outbound:</text>
  <text x="1085" y="496" text-anchor="middle" class="small">VP++ + DMA</text>
  <text x="1085" y="522" text-anchor="middle" class="small">Inbound:</text>
  <text x="1085" y="538" text-anchor="middle" class="small">MMIO + SRAM</text>

  <rect x="1210" y="425" width="150" height="80" rx="9" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="1285" y="458" text-anchor="middle" class="block-title">Chip Fabric /</text>
  <text x="1285" y="480" text-anchor="middle" class="block-title">2D Mesh NoC</text>

  <path d="M600 230 V290" class="control" marker-end="url(#arrow-blue)"/>
  <text x="612" y="264" class="edge-label" fill="#1e40af">MMIO</text>
  <path d="M185 340 V400" class="control" marker-end="url(#arrow-blue)"/>
  <path d="M400 340 V390" class="control" marker-end="url(#arrow-blue)"/>
  <path d="M625 340 V390" class="control" marker-end="url(#arrow-blue)"/>
  <path d="M860 340 V390" class="control" marker-end="url(#arrow-blue)"/>
  <text x="194" y="373" class="edge-label" fill="#1e40af">control</text>
  <text x="409" y="370" class="edge-label" fill="#1e40af">control</text>
  <text x="634" y="370" class="edge-label" fill="#1e40af">control</text>
  <text x="869" y="370" class="edge-label" fill="#1e40af">control</text>

  <path d="M360 200 H70 V617 H120" class="local" marker-end="url(#arrow-green)"/>
  <text x="79" y="560" class="edge-label" fill="#166534">Scalar + RVV</text>
  <text x="79" y="577" class="edge-label" fill="#166534">local load/store</text>
  <path d="M400 500 V590" class="local" marker-end="url(#arrow-green)"/>
  <path d="M625 500 V590" class="local" marker-end="url(#arrow-green)"/>
  <path d="M860 500 V590" class="local" marker-end="url(#arrow-green)"/>
  <text x="410" y="548" class="edge-label" fill="#166534">local data</text>
  <text x="635" y="548" class="edge-label" fill="#166534">operands / results</text>
  <text x="870" y="548" class="edge-label" fill="#166534">tensor data</text>
  <path d="M590 645 V690" class="local" marker-start="url(#arrow-green-start)" marker-end="url(#arrow-green)"/>
  <text x="603" y="674" class="edge-label" fill="#166534">physical bank beats</text>

  <path d="M840 175 H1085 V370" class="external" marker-end="url(#arrow-purple)"/>
  <text x="885" y="164" class="edge-label" fill="#6d28d9">fetch / global access</text>
  <path d="M490 445 H510 V540 H1030" class="external" marker-end="url(#arrow-purple)"/>
  <text x="720" y="530" class="edge-label" fill="#6d28d9">DMA bulk external</text>
  <path d="M1030 405 H1000 V315" class="external" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/>
  <text x="932" y="374" class="edge-label" fill="#6d28d9">inbound MMIO</text>
  <path d="M1030 530 H1000 V617" class="external" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/>
  <text x="926" y="574" class="edge-label" fill="#6d28d9">inbound SRAM</text>
  <path d="M1140 465 H1210" class="external" stroke-width="3" marker-start="url(#arrow-purple-start)" marker-end="url(#arrow-purple)"/>

  <text x="70" y="794" class="small" fill="#1e40af">Blue: control only</text>
  <text x="220" y="794" class="small" fill="#166534">Green: local SRAM data</text>
  <text x="850" y="794" class="small" fill="#6d28d9">Purple: external / inbound</text>
  <text x="600" y="850" text-anchor="middle" class="normal" font-weight="700" fill="#b91c1c">No full AXI data crossbar inside NEO-CORE</text>
</svg>
